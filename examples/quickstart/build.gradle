// KRPC 5-minute quickstart — a single, DB-free, JWT-free @RpcService.
// Deliberately NOT published: it does not apply gradle/upload.gradle, so it
// produces no Maven publication and never enters the Maven Central bundle.
plugins {
    id 'io.quarkus' version "$quarkusMiniSupport"
}

group = "tech.krpc.examples"

dependencies {
    // Brings rpc-api + rpc-common + rpc-server + http-server (all `api`), and
    // ext-rpc on the runtime classpath (Quarkus discovers the extension).
    implementation project(':rpc-server-quarkus')

    implementation platform("io.quarkus.platform:quarkus-bom:${quarkusMiniSupport}")
    implementation "io.quarkus:quarkus-arc"
    implementation "io.quarkus:quarkus-netty"
    // jakarta.validation support for the @NotBlank demo (SPEC §7).
    implementation "io.quarkus:quarkus-hibernate-validator"

    runtimeOnly "io.grpc:grpc-netty:${grpcVersion}"

    // Wave 3 Phase A: container-level regression guard for the agent HTTP endpoints
    // (@QuarkusTest boots this default consumer under DEFAULT Arc config).
    // Version-managed by the quarkus-bom imported above. Excluding
    // quarkus-bootstrap-maven-resolver mirrors test-server: it drags in a guice GMM
    // "-classes" variant that isn't resolvable from the local Maven cache.
    testImplementation("io.quarkus:quarkus-junit5") {
        exclude module: 'quarkus-bootstrap-maven-resolver'
    }

    // OTEL-001 B1d (ADR-0006): container proof that the consumer's OpenTelemetry CDI bean is
    // resolvable at RpcServiceExpose @Startup and gets installed into krpc, so a real gRPC call
    // exports a SERVER span. TEST SCOPE ONLY — the published example's production deps are unchanged
    // (no OTel SDK/exporter ships with the example).
    testImplementation("io.quarkus:quarkus-opentelemetry") {
        exclude module: 'quarkus-bootstrap-maven-resolver'
    }
    // OTEL-003: NO opentelemetry-sdk-testing. Its SettableContextStorageProvider SPI hijacks OTel's
    // LazyStorage and pins tests to ThreadLocal storage, hiding the QuarkusContextStorage cross-thread
    // defect this suite exists to catch. RecordingSpanExporter (opentelemetry-sdk, transitive via
    // quarkus-opentelemetry) replaces InMemorySpanExporter.
    testImplementation project(':rpc-client')
    testImplementation "io.grpc:grpc-stub:${grpcVersion}"
}

// OTEL-003 (test scope only): a real Quarkus consumer resolves QuarkusContextStorage as the OTel
// ContextStorage (via the quarkus-opentelemetry ContextStorageProvider SPI). Pin it explicitly so
// the container tests deterministically exercise the SAME cross-thread context propagation the real
// consumer assembly uses. See docs/orchestration/OTEL-003_IMPL_omp.md ("the wiring diff").
test {
    systemProperty 'io.opentelemetry.context.contextStorageProvider',
            'io.quarkus.opentelemetry.runtime.OpenTelemetryContextStorageProvider'
}

// Convenience alias so `gradle :examples:quickstart:run` starts the server in
// Quarkus dev mode (live reload; Ctrl-C to stop).
tasks.register('run') {
    group = 'application'
    description = 'Run the quickstart in Quarkus dev mode (Ctrl-C to stop).'
    dependsOn 'quarkusDev'
}

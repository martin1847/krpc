
apply from: "$rootProject.projectDir/gradle/upload.gradle"


dependencies {

    api project(':rpc-api')
    api project(':rpc-common')
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.netty:netty-common:$nettyGrpcVersion"
//    implementation "io.grpc:grpc-xds:${grpcVersion}"



    // implementation'jakarta.enterprise:jakarta.enterprise.cdi-api:2.0.2'
    // IOURING-001 Phase 2 (flag-gated PoC): compileOnly so the io_uring wiring compiles without
    // forcing the transport at runtime. rpc-server stays transport-agnostic; default path is
    // unchanged generic ServerBuilder.forPort. Runtime artifacts (grpc-netty + incubator native
    // .so) are provided by the deployment module (test-server) only when io_uring is exercised.
    compileOnly "io.grpc:grpc-netty:${grpcVersion}"
    compileOnly "io.netty.incubator:netty-incubator-transport-classes-io_uring:${nettyIoUringIncubatorVersion}"

//    implementation "io.quarkus:quarkus-core:$quarkusPlatformVersion"
//    implementation "io.quarkus:quarkus-builder:$quarkusPlatformVersion"
//
//    implementation "io.quarkus:quarkus-core-deployment:$quarkusPlatformVersion"


//    implementation "io.smallrye.config:smallrye-config-core:2.4.4"

    /// TEST
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

//    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
//    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

plugins {
    id 'org.kordamp.gradle.jandex' version "$jandexVersion"
}

apply from: "$rootProject.projectDir/gradle/upload.gradle"


//version = "1.0.0"

dependencies {
//    compileOnly "javax.annotation:javax.annotation-api:1.2"


    api project(':rpc-server')
    // ADR-0004 (AGENT-001 P0): agent HTTP discover/invoke handlers ride the existing
    // http-server netty transport (GetHandler/PostHandler beans auto-registered by HttpHandlerExpose).
    api project(':http-server')
//    implementation "io.grpc:grpc-services:${grpcVersion}"

    // just for overridden
//    api "com.google.protobuf:protobuf-javalite:$protobufVersion"


    implementation "tech.krpc.ext:ext-rpc:$extRpcVersion"
//    implementation "tech.krpc.ext:ext-rpc:1.0.0.tmp"


    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    // ADR-0004 (AGENT-001 P0) unit tests: plain JUnit5, no Quarkus boot / no DB.
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "io.grpc:grpc-stub:${grpcVersion}"
    testImplementation "io.netty:netty-codec-http:$nettyGrpcVersion"
    // NS-6 default-OFF contract test reflects on @ConfigProperty (MicroProfile Config, via
    // quarkus-arc) to assert defaultValue=="false" on the mcp-enable flags. quarkus-arc is
    // compileOnly for main and compileOnly is NOT inherited by test; this is reflection only
    // (no CDI container is booted — the tests are plain JUnit, not @QuarkusTest).
    testImplementation "io.quarkus:quarkus-arc:$quarkusMiniSupport"


//    implementation platform("io.quarkus:quarkus-bom:${quarkusPlatformVersion}")

//    implementation platform("io.quarkus:quarkus-bom:2.4.2.Final")
    compileOnly "io.quarkus:quarkus-arc:$quarkusMiniSupport"
    //this version is the max to support JNI/DrawCaptcha
//    compileOnly "io.quarkus:quarkus-core:$quarkusMiniSupport"

    compileOnly "io.netty:netty-common:$nettyGrpcVersion"
    compileOnly "io.netty:netty-handler:$nettyGrpcVersion"

    runtimeOnly "io.grpc:grpc-netty:${grpcVersion}"

    // native
//    compileOnly 'org.graalvm.sdk:nativeimage:24.0.0'
    // native-Target_io_netty_handler_codec_http_HttpContentDecompressor
//    compileOnly "io.netty:netty-codec-http:$nettyGrpcVersion"


}

compileTestJava {
    dependsOn('jandex')
}

test {
    useJUnitPlatform()
}

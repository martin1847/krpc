plugins {
    id 'org.kordamp.gradle.jandex' version "$jandexVersion"
}

apply plugin: 'org.kordamp.gradle.jandex'
//apply from: "$rootProject.projectDir/gradle/upload.gradle"

group = "test.tech.krpc"

dependencies {

    api project(':rpc-api')


    testImplementation project(':ext-rpc-gen')
    testImplementation project(':rpc-client')
    testImplementation "io.grpc:grpc-netty:${grpcVersion}"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"
//    api 'javax.validation:validation-api:2.0.1.Final'
//    api 'jakarta.validation:jakarta.validation-api:2.0.2'
//
//    implementation 'org.freemarker:freemarker:2.3.31'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

}
compileTestJava {
    dependsOn('jandex')
}

// ARCH-001 rider: test-api's src/test sources are main()-based scratch/demo programs
// (no @Test, no JUnit imports), so Gradle 9 discovers zero tests and fails the task by
// default. There are no real tests to run here; disable the no-tests guard. This changes
// no test behavior — it only stops the empty task from failing the build.
test {
    failOnNoDiscoveredTests = false
}
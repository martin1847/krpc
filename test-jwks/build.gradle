
//apply plugin:  'io.quarkus'


dependencies {

    implementation 'com.nimbusds:nimbus-jose-jwt:10.0.1'

    // PEM key parsing in Java
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'


//    implementation 'org.bouncycastle:bcpkix-jdk15on:1.69'


    //    testImplementation 'io.jsonwebtoken:jjwt-api:0.11.2'
//
    testImplementation 'com.auth0:java-jwt:4.5.0'
    testImplementation 'com.auth0:jwks-rsa:0.22.1'
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
//
//    testImplementation 'io.jsonwebtoken:jjwt-impl:0.11.2'
//    testImplementation 'io.jsonwebtoken:jjwt-jackson:0.11.2'


    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
//    testImplementation "com.bt.rpc:rpc-server:1.0.0"
}


compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}


group = "tech.krpc.ext"
version = "1.0.1"

description = 'krpc polyglot client generator — emits typed TypeScript/Dart clients from krpc contract metadata for agent frontends.'
apply from: "$rootProject.projectDir/gradle/upload.gradle"

dependencies {

    implementation project(':rpc-api')
    implementation project(':rpc-server')
    // GEN-NETTY-102: rpc-server keeps grpc-netty compileOnly BY DESIGN (server consumers get it via
    // rpc-server-quarkus/-spring runtimeOnly). ext-rpc-gen depends on rpc-server directly and Gen.scan
    // loads tech.krpc.server.RpcServerBuilder (→ io.grpc.netty.NettyServerBuilder) at scan time, so
    // this leaf must carry grpc-netty at runtime itself — else standalone gen consumers hit
    // NoClassDefFoundError (1.0.1 regression). Version is BOM-tracked (root gradle.properties).
    implementation "io.grpc:grpc-netty:${grpcVersion}"

//    implementation 'com.zlkj.common:cdn-api:1.1.1220'
//    api 'javax.validation:validation-api:2.0.1.Final'
//    api 'jakarta.validation:jakarta.validation-api:2.0.2'
//
    implementation 'org.freemarker:freemarker:2.3.34'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    // GENDET-002: module had NO test source set. Plain JUnit 5 unit tests over the emit
    // pipeline (Gen.genApiMetaRoot / topoOrderDtos) — no Quarkus boot, no DB. logback-classic
    // is the slf4j backend so the cycle WARN is capturable via a ListAppender.
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "ch.qos.logback:logback-classic:1.5.18"

}

// Root subprojects{} test block does NOT call useJUnitPlatform(); JUnit 5 tests here need it.
test {
    useJUnitPlatform()
}


// JAPICMP-001 (SPEC §14.2): put the japicmp plugin on the ROOT buildscript classpath. Unlike the
// plugins-DSL `apply false`, a buildscript classpath is inherited by every subproject AND by
// `apply from:` scripts, so gradle/japicmp.gradle can both import the rule types and apply the
// plugin to the covered modules. me.champeau.gradle.japicmp is the de-facto Gradle japicmp wrapper
// (Gradle 6+, used by Gradle/Micronaut/OpenSearch); its rich-report rule DSL is what lets us
// ENCODE the patch/minor/ack policy (SPEC §14.1), not merely report the diff.
buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'me.champeau.gradle:japicmp-gradle-plugin:0.4.6'
    }
}

plugins {
    id 'java-library'
    id "jacoco"
//    id 'io.quarkus'  version "$quarkusVersion" apply false
//    id "org.sonarqube" version "3.4.0.2513" // disabled: 3.x sonarqube plugin is incompatible with Gradle 9
//    id "io.quarkus.extension"  version "$quarkusPluginVersion"// apply false
//    id 'maven-publish' //apply false
}



allprojects {

    repositories {
        mavenLocal()
//        maven{
//            url "$MAVEN_REPO"
//            credentials(HttpHeaderCredentials) {
//                name = "X-JFrog-Art-API"
//                value = System.getenv("JCR_TOKEN" )?:"$JCR_TOKEN"
//            }
//            authentication {
//                header(HttpHeaderAuthentication)
//            }
//        }
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        mavenCentral()
    }

}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    group = "$group"
    version = "$version"

    java{
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    // IOURING-001 Phase 1 CVE wave: converge EVERY io.netty:* (incl. transitive-only
    // netty-codec-http2 / -socks / handler-proxy, which no module declares directly) on
    // nettyGrpcVersion so the CVE-fixed 4.1.135 reaches codec-http2 (both hot-path HTTP/2 CVEs)
    // and the single-Netty convergence invariant (c433f3f) holds.
    //
    // BUILD-LOCAL ONLY (do NOT import io.netty:netty-bom as a platform): a published platform
    // import leaks into every module's POM <dependencyManagement> + GMM endorseStrictVersions,
    // which would suppress a downstream consumer's own BOM. resolutionStrategy.eachDependency runs
    // at resolution time and is NEVER written to the POM/GMM, so consumers keep BOM precedence
    // while krpc's own build (JVM + native) still converges on 4.1.135.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.netty') {
                details.useVersion "$nettyGrpcVersion"
                details.because 'IOURING-001 CVE wave: single-Netty convergence to 4.1.135 (build-local, not published)'
            }
        }
    }

    plugins.withId('org.kordamp.gradle.jandex') {
        tasks.named('javadoc') {
            dependsOn(tasks.named('jandex'))
        }
    }

    test {
        //        useJUnitPlatform()
//        systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
        systemProperty "jdbc.host" , "mysql-junit.infra"
        systemProperty "quarkus.log.level","DEBUG"

        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        reports {
            xml.required = true
//            html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        }
    }

//  gradle allDeps > dep.txt
    task allDeps(type: DependencyReportTask) {}

}

// JAPICMP-001 (SPEC §14.2): binary/source-compat gate — task `japicmpCheck`. Applied last so
// the covered subprojects (rpc-api, rpc-common) already have their java-library config.
apply from: "$rootProject.projectDir/gradle/japicmp.gradle"

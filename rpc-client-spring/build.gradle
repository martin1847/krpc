
description = 'krpc Spring client — wires the krpc gRPC/HTTP2 client into Spring apps for calling krpc microservices.'
apply from: "$rootProject.projectDir/gradle/upload.gradle"


dependencies {

    api(project(':rpc-api')){
        exclude(module:"jakarta.validation-api")
    }

    api(project(':rpc-client')){
        exclude(module:"jakarta.validation-api")
        exclude(module:"slf4j-api")
    }

    compileOnly "org.slf4j:slf4j-api:$slf4jVersion"
//    implementation 'org.springframework:spring-context:5.3.31'
    runtimeOnly "io.grpc:grpc-netty:${grpcVersion}"
//    api "io.grpc:grpc-netty:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    // https://mvnrepository.com/artifact/org.springframework/spring-context
    implementation 'org.springframework:spring-context:5.3.39'
// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-autoconfigure
    implementation 'org.springframework.boot:spring-boot-autoconfigure:2.7.18'


    ////  TEST //////
//    implementation 'jakarta.annotation-api:jakarta.annotation:1.3.5'

//    testImplementation project(':demo-api')
//    testImplementation group: 'junit', name: 'junit', version: '4.12'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    // HARDEN-B2: C8 channel-leak / default-port regressions — JUnit5 + in-process gRPC, no live server.
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation "org.slf4j:slf4j-api:$slf4jVersion"
}

test {
    useJUnitPlatform()
}

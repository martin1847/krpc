# IOURING-001 Phase 2 (flag-gated PoC) native-image metadata for the Netty 4.1-line io_uring
# INCUBATOR transport (io.netty.incubator.channel.uring). Hand-translated from Netty 4.2's shipped
# in-jar config (io.netty.channel.uring) - the incubator ships zero metadata. All jni/reflect/resource
# entries are conditioned on typeReachable io.netty.incubator.channel.uring.Native, so they are inert
# unless io_uring is reachable. Validated by native build + boot with KRPC_IOURING=1 + live RPC.
# init-at-run-time: the uring package + shared unix classes dlopen/probe the kernel in their static
# initializers; defer to runtime (idempotent with krpc's existing epoll unix.* init entries).
Args = --initialize-at-run-time=io.netty.incubator.channel.uring,io.netty.channel.unix.Limits,io.netty.channel.unix.IovArray,io.netty.channel.unix.Errors

# App name → RPC call path prefix (SPEC §5): quickstart/Hello/hello
rpc.server.app = quickstart
# gRPC + HTTP gateway port (default; shown for clarity)
rpc.server.port = 50051

# No rpc.server.jwks configured → authentication is skipped entirely (SPEC §8.2).
# No datasource configured → no database needed to run this quickstart.

quarkus.log.level = INFO
%dev.quarkus.log.level = DEBUG

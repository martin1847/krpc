# App name -> RPC call path prefix (SPEC §5): bench/Hello/hello
rpc.server.app = bench
rpc.server.port = 50051

# ---- BENCH-001 tested dimension ----------------------------------------------
# rpc.server.defaultExecutor: false (default) = VT per-task executor; true =
# grpc DEFAULT_EXECUTOR_POOL (platform cached pool). Flipped at RUNTIME via env
# RPC_SERVER_DEFAULTEXECUTOR=true|false — no rebuild between the VT and pool
# benchmarks (verified by the startup-log evidence gate; see RESULTS.md).
# rpc.server.defaultExecutor = false
# ------------------------------------------------------------------------------

# DB-free, JWT-free: no rpc.server.jwks (auth skipped, SPEC §8.2), no datasource
# (so the native SIGSEGV-on-missing-datasource trap of SPEC §13.3 does not apply).

quarkus.log.level = INFO

# The @RpcService interface + DTOs live in the separate runtime-agnostic contract
# jar. Quarkus/Jandex must index it so (a) Arc/ext-rpc discover the @RpcService and
# (b) the native DTO reflection scan reaches HelloRequest/HelloReply (SPEC §13.5).
quarkus.index-dependency.contract.group-id = tech.krpc.bench
quarkus.index-dependency.contract.artifact-id = contract

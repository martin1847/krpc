name: Docs site

# Builds the Docusaurus docs-site and deploys it to GitHub Pages.
#
# NOTE: deployment requires GitHub Pages to be enabled with source
# "GitHub Actions" in repository Settings → Pages. That switch is an
# orchestrator/maintainer action; until it is flipped, the build job still runs
# and validates the site, but the deploy job cannot publish.

on:
  push:
    branches: [dev]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'

# Least privilege at the top level: only the checkout needs repo read.
# Pages/OIDC write is granted to the deploy job alone (below).
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

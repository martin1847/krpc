jwks.json=test.bo.jwks.json
rpc.server.jwks = https://zlkj-jwks.oss-cn-shanghai.aliyuncs.com/.well-known/${jwks.json}

#rpc.server.exit-on-jwks-error = true


#RPC_SERVER_EXIT_ON_JWKS_ERROR

# export QUARKUS_DATASOURCE_PASSWORD=youshallnotpass ;
# {_DEV_}QUARKUS_HTTP_PORT=8181
# OR   -Dquarkus.datasource.password=youshallnotpass
quarkus.datasource.db-kind = mysql
quarkus.datasource.username = example
# Deployments override these from the environment (QUARKUS_DATASOURCE_JDBC_URL /
# _USERNAME / _PASSWORD, see src/main/helm/values.yaml). The committed default is a
# plain local Docker MySQL so a fresh checkout carries no site-specific coordinate.
# TESTCONTAINERS-001: the `test` profile never uses this URL — MySqlTestResource
# provisions a throwaway MySQL container and overrides the datasource config, so
# `gradle build` needs Docker but no reachable database.
quarkus.datasource.jdbc.url = jdbc:mysql://localhost:3306/example

#quarkus.mybatis.config-files = mybatis-config.xml


quarkus.hibernate-validator.fail-fast=true

#log
quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{1.}] (%t) :%X{traceId} %s%e%n
quarkus.log.category."org.apache.ibatis".level=DEBUG
quarkus.log.category."com.zlkj.test.mapper".level=DEBUG
#quarkus.log.category."io.quarkus.arc".level=DEBUG


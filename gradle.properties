## above override grpc-api dependency//
# common lib
lombokVersion=1.18.42
# OTEL-001 (ADR-0006): OpenTelemetry API only — span creation joins the framework via the
# OTel *API/instrumentation*, never the SDK/exporter (ADR-0001 / NS-3). Pinned to the OTel
# SDK version shipped by the Quarkus 3.33 LTS BOM (1.49.0) so krpc's compile-time API matches
# the consumer's runtime API exactly — zero skew. Consumers' Quarkus BOM still wins the
# transitive version (this is a plain api dep, not a published platform constraint).
otelVersion=1.49.0
slf4jVersion=2.0.17
#slf4jVersion=1.7.36
jacksonVersion=2.19.4


# test
mockitoVersion=5.15.2
# TESTCONTAINERS-001: DB-backed tests provision their own MySQL container instead of dialing a
# site-local host, so `gradle build` is green on any machine with Docker. Pinned to the version
# the Quarkus 3.33 LTS BOM already resolves, so the test classpath stays single-versioned.
testcontainersVersion=2.0.4

# JAPICMP-001 (SPEC §14.2): binary/source-compat gate baseline — the LATEST released *-api on
# Maven Central to diff the working tree against. Bump-on-release: after publishing 1.MINOR.PATCH,
# set this to that version so the NEXT dev cycle diffs against it (see the "Release flow" section of
# docs/orchestration/JAPICMP-001_IMPL_omp.md). Overridable per-run: -Pjapicmp.baseline=x.y.z
# NOTE: the 1.1.0→1.1.1 diff is itself a FINDING — a binary-incompatible enum change
# (EnvUtils$AppEnv.PRE removed) shipped as a PATCH, the exact SPEC §14.1 violation this gate now
# prevents. See the findings doc; reproduce with -Pjapicmp.baseline=1.1.0.
japicmp.baseline=1.1.1



description = 'Shared krpc runtime internals — codec, gRPC proto bridge, and ApiMeta introspection powering the krpc client and server runtimes.'
apply from: "$rootProject.projectDir/gradle/upload.gradle"


dependencies {
    api project(':rpc-api')

    // com.google.api.grpc/proto-google-common-protos/1.12.0

    api "io.grpc:grpc-api:${grpcVersion}"
    api "com.google.errorprone:error_prone_annotations:$errorProneVersion"
    api "com.google.guava:guava:$guavaVersion"
    // above override grpc-api dependency//


//    api("io.grpc:grpc-protobuf-lite:${grpcVersion}")

//    api "com.google.protobuf:protobuf-javalite:$protobufVersion"

//    api 'com.alibaba:fastjson:1.2.68'
//    api 'jakarta.json.bind:jakarta.json.bind-api:2.0.0'
    api "org.slf4j:slf4j-api:$slf4jVersion"

    // OTEL-001 (ADR-0006): OpenTelemetry API only (no SDK/exporter — ADR-0001 / NS-3). Exposed
    // as `api` so the gRPC server/client interceptors (rpc-server / rpc-client) and the HTTP
    // handler (http-server) inherit it. With no OTel SDK on the consumer classpath,
    // GlobalOpenTelemetry is a no-op: zero spans, zero header changes, zero cost beyond a no-op call.
    api "io.opentelemetry:opentelemetry-api:${otelVersion}"

//    implementation 'org.yaml:snakeyaml:1.28'
//    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    implementation "io.netty:netty-buffer:$nettyGrpcVersion"


//    testImplementation 'junit:junit:4.13.1'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    testImplementation "com.google.protobuf:protobuf-java:3.25.3"

    // EnvUtils APP_ENV normalisation regression — plain JUnit5, no container.
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// AGENT-002 F2: the krpc build version has ONE source of truth — the Gradle project.version.
// Generate a compile-time constant (BuildVersion.VERSION) from it; RpcConstants.VERSION derives
// from that constant. A compile-time String constant is inlined into bytecode, so it is
// native-image safe (no runtime resource lookup) and cannot drift from gradle.properties.
def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version')
def generateBuildVersion = tasks.register('generateBuildVersion') {
    def outDir = generatedVersionDir
    def ver = project.version.toString()
    inputs.property('version', ver)
    outputs.dir(outDir)
    doLast {
        def pkgDir = outDir.get().dir('tech/krpc/common').asFile
        pkgDir.mkdirs()
        new File(pkgDir, 'BuildVersion.java').text = """package tech.krpc.common;

/** Generated from Gradle {@code project.version} — do not edit. Single source of the krpc build version. */
public final class BuildVersion {
    private BuildVersion() {}
    public static final String VERSION = "${ver}";
}
"""
    }
}
sourceSets.main.java.srcDir generatedVersionDir
tasks.named('compileJava') { dependsOn generateBuildVersion }
tasks.matching { it.name in ['sourcesJar', 'javadoc'] }.configureEach { dependsOn generateBuildVersion }

test {
    useJUnitPlatform()
}

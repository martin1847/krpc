# ARCH-001 freeze ratchet configuration (NORTH_STAR doctrine: baselines only shrink).
#
# The frozen violation stores live under arch-test/archunit_store/ (one text file
# per rule, plus a stored.rules index, committed to git). This config locks the
# baseline as a ONE-WAY RATCHET — day-to-day/CI runs can never mutate the store:
#
#   allowStoreCreation=false -> the store directory can never be auto-created.
#   allowStoreUpdate=false   -> the store can never be written: no NEW rule-id entry
#                               can be silently added (closes the back door where a
#                               new rule or a renamed .as(...) would self-freeze all
#                               its current violations as passing baseline), and no
#                               existing entry can be rewritten.
#   refreeze=false           -> a NEW violation of a frozen rule can never be absorbed;
#                               it fails the build. Existing (grandfathered) violations
#                               still pass.
#
# Because the store is read-only here, EVERY baseline change (adding a rule, or
# SHRINKING after a fix) is a deliberate, reviewed, committed act — never silent.
# To (re)generate the store, run ONCE locally with both write flags flipped on:
#   1. temporarily set allowStoreCreation=true AND allowStoreUpdate=true below
#   2. gradle :arch-test:test        (writes the store to current violations)
#   3. set both back to false, review the store diff, commit
# (The -Darchunit.* system-property override does NOT work — ArchUnit reads freeze
# config only from this file. See ADR-0005.)
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="KRPC mark">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#k-bg)"/>
  <!-- the K: one stem (the single Java interface) fanning out into three faces -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
    <!-- stem -->
    <path d="M38 30 V98" stroke="#ffffff"/>
    <!-- upper ray: gRPC -->
    <path d="M40 64 L84 30" stroke="#ffffff"/>
    <!-- lower ray: HTTP -->
    <path d="M40 64 L84 98" stroke="#ffffff"/>
    <!-- middle ray: agent / MCP -->
    <path d="M40 64 H98" stroke="#fbbf24"/>
    <path d="M84 48 L100 64 L84 80" stroke="#fbbf24"/>
  </g>
</svg>
